name: Android PGO (scoped)

# Builds the instrumented arm64 game module for profile-guided optimization,
# and the profile-optimized module once a profile has been collected on a phone.
#
# Why CI. The instrumented compile is the slowest step in the Android build. On
# a four-core box with 11 GB of RAM, three concurrent compiles of a 1.9 MB
# generated chunk ran for over ninety minutes each: they contend for memory
# bandwidth and there is no room to spare. A runner has more cores and more
# memory, so the same ten chunks land in a fraction of the time. The other 738
# chunks compile without instrumentation, from a plain -O2 build.
#
# Why there is no disc here. The composite source (build/device/composite-src,
# 877 MB of generated C) is derived from the player's own disc image and is
# deliberately not in this repository - scripts/audit_repo.sh fails any tracked
# *.iso, *.dol, *.rel or build/ path. Rather than make the player host a 1.3 GB
# copyrighted image somewhere a runner can fetch it, this workflow caches the
# composite itself:
#
#   first run    needs disc_url, extracts, translates, generates the composite,
#                and caches ref/recompcore plus the composite tree
#   later runs   the cache hit skips all of that and goes straight to compiling
#
# A GitHub Actions cache holds 10 GB per repository and this is well under it.
# ref/recompcore (113 MB) is cached in the same entry and is fetched from its
# public upstream on a cold run, so nothing game-derived ever needs to be stored
# on purpose - only as a side effect of the cache.
#
# This workflow does not sign anything. It produces an unsigned .so artifact to
# drop into the APK; a distribution certificate has no business in a public
# repository's secrets.
#
# Inputs:
#   disc_url    Required ONLY on the first run, to seed the composite cache.
#               Leave blank on every run after that. If it is blank and the
#               cache is cold, this job fails with an explanation rather than
#               silently doing nothing.
#   profile_url Optional HTTPS URL of an llvm .profdata. When given, the
#               profile-optimized module is built instead of the instrumented
#               one. See the note at the end about what it is worth.
#
# Pinned revisions, read from scripts/builder/profiles/bluewake.sh so this file
# cannot drift from the builder's own pins.

on:
  workflow_dispatch:
    inputs:
      disc_url:
        description: 'GZLE01 disc image URL. Needed ONCE to seed the cache; blank afterwards.'
        required: false
        default: ''
      profile_url:
        description: 'Optional HTTPS URL of a .profdata to optimize against'
        required: false
        default: ''

concurrency:
  group: android-pgo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  module:
    name: Build the game module (scoped PGO)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NDK_VERSION: r27c
      ABI: arm64-v8a
      MODULE: gGZLE01_recomp
      OUT: build/device
      # The builder's pins (scripts/builder/profiles/bluewake.sh).
      RECOMPCORE_URL: https://github.com/elliotttate/RecompCore.git
      RECOMPCORE_SHA: 8ab24daee9c641634fda5cac30389ad4b2cfda5e
      DOLRECOMP_SHA: b8b534591cba8ca7cd43943a655ee6e2591cf5de

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up the NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build git curl python3
          cmake --version
          ninja --version

      # One cache entry for both the pinned sources and the generated composite.
      # The key includes the patch list, because applying the patches changes
      # the tree and the composite generator is not the only thing that can
      # invalidate it. ref/recompcore is a git checkout with an applied patch
      # set, so caching the working tree (not just the clone) is what saves the
      # slow part.
      # Caches ref/recompcore (113 MB) and the generated composite (877 MB), and
      # the extracted game files (12 MB) that generate_composite.py reads its
      # REL binaries from. Deliberately NOT caching $OUT/translated: it is
      # 878 MB of intermediate C that nothing after the generate step reads, and
      # caching it would nearly double the entry for no benefit. That brings the
      # entry to about 1 GB, comfortably inside the 10 GB per-repository limit.
      - name: Restore the pinned sources and the composite
        uses: actions/cache@v4
        with:
          path: |
            ref/recompcore
            ${{ env.OUT }}/composite-src
            ${{ env.OUT }}/game
          key: pgo-tree-${{ hashFiles('config/recompcore-patches.json', 'scripts/generate_composite.py', 'scripts/apply_recompcore_patches.py') }}

      # The cold path. On any later run the cache above has already restored
      # ref/recompcore, the extracted game files and the generated composite, and
      # this step short-cluits.
      - name: Fetch the pinned RecompCore sources
        run: |
          set -euo pipefail
          if [ "$(git -C ref/recompcore rev-parse HEAD 2>/dev/null || echo none)" = "$RECOMPCORE_SHA" ]; then
            echo "ref/recompcore already at $RECOMPCORE_SHA (from cache)"
            exit 0
          fi
          echo "fetching RecompCore $RECOMPCORE_SHA from $RECOMPCORE_URL"
          rm -rf ref/recompcore
          git clone --quiet "$RECOMPCORE_URL" ref/recompcore
          git -C ref/recompcore checkout --quiet --detach "$RECOMPCORE_SHA"
          git -C ref/recompcore submodule sync --quiet -- DolRecomp
          git -C ref/recompcore submodule update --init --depth 1 -- DolRecomp
          if [ "$(git -C ref/recompcore/DolRecomp rev-parse HEAD)" != "$DOLRECOMP_SHA" ]; then
            echo "::error::DolRecomp is not at the pinned $DOLRECOMP_SHA"
            exit 1
          fi
          # The same patch application the builder does in profile_dependencies.
          # Without it the module compiles against unpatched RecompCore and the
          # result is not the module the phone has been running.
          python3 scripts/apply_recompcore_patches.py
          echo "recompcore: $(git -C ref/recompcore rev-parse HEAD)"
          echo "dolrecomp:  $(git -C ref/recompcore/DolRecomp rev-parse HEAD)"

      - name: Extract, translate and generate the composite
        env:
          DISC_URL: ${{ github.event.inputs.disc_url }}
        run: |
          set -euo pipefail
          if [ -f "$OUT/composite-src/generated.h" ]; then
            echo "composite already cached; skipping extract, translate and generate"
            exit 0
          fi
          if [ -z "$DISC_URL" ]; then
            cat >&2 <<'EOF'
          ::error::No composite in the cache and no disc_url given.
          ::error::This run needs the disc exactly once: it extracts, translates and
          ::error::generates the 877 MB composite, then caches it. Every run after
          ::error::this one is a cache hit and needs no disc at all.
          ::error::Re-run with disc_url set to a private HTTPS URL of a GZLE01 USA rev 0 image.
          EOF
            exit 1
          fi
          mkdir -p "$OUT"
          # -L because the URL is usually a redirect to object storage.
          curl -fsSL -o "$RUNNER_TEMP/GZLE01.iso" "$DISC_URL"
          shasum -a 256 "$RUNNER_TEMP/GZLE01.iso"
          rm -f "$RUNNER_TEMP/GZLE01.iso"   # do not let it reach the cache

          # profile_extract: builds the project's own disc reader, which checks
          # the disc ID and the executable hash and refuses any other revision.
          clang -O2 -o "$RUNNER_TEMP/disc_extract" \
            scripts/ios/disc_extract.c apple/ios/src/disc_import.c apple/ios/src/disc_sha1.c \
            -Iapple/ios/src
          "$RUNNER_TEMP/disc_extract" "$RUNNER_TEMP/GZLE01.iso" "$OUT/game"
          [ "$(ls "$OUT/game/rels" | wc -l | tr -d ' ')" = 415 ] \
            || { echo "::error::expected 415 RELs"; exit 1; }

          # profile_translate
          cmake -S ref/recompcore/DolRecomp -B "$OUT/dolrecomp" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$OUT/dolrecomp" --target dolrecomp -j "$(nproc)"
          rm -rf "$OUT/translated" && mkdir -p "$OUT/translated/dol" "$OUT/translated/rels"
          "$OUT/dolrecomp/dolrecomp" --gamecube --backend c --cpu gekko \
            --partition-instructions 4096 "$OUT/game/main.dol" "$OUT/translated/dol" -j "$(nproc)"
          "$OUT/dolrecomp/dolrecomp" --gamecube --backend c --cpu gekko \
            --rel-base 0xC0400000 "$OUT/game/rels" "$OUT/translated/rels" -j "$(nproc)"

          # profile_generate
          rm -rf "$OUT/composite-src"
          python3 scripts/generate_composite.py \
            --dol-dir "$OUT/translated/dol/generated" \
            --rels-dir "$OUT/translated/rels/generated/rels" \
            --rels-bin-dir "$OUT/game/rels" \
            --main-dol "$OUT/game/main.dol" \
            --output-dir "$OUT/composite-src"
          python3 scripts/ios/composite_manifest.py "$OUT/composite-src"
          ls "$OUT/composite-src" | head

      - name: Configure the module
        env:
          PROFILE_URL: ${{ github.event.inputs.profile_url }}
        run: |
          set -euo pipefail
          # Either COMPOSITE_PGO_INSTRUMENT_DIR (collection) or
          # COMPOSITE_PGO_PROFILE_DIR (optimized), never both. Both are applied
          # per source in cmake/composite/CMakeLists.txt, so only the ten hot
          # chunks carry them; the other 738 compile as a plain -O2 build.
          extra=()
          if [ -n "$PROFILE_URL" ]; then
            curl -fsSL -o "$RUNNER_TEMP/profile.profdata" "$PROFILE_URL"
            extra=(-DCOMPOSITE_PGO_PROFILE_DIR="$RUNNER_TEMP")
          else
            extra=(-DCOMPOSITE_PGO_INSTRUMENT_DIR=/data/data/dev.bluewake.bluewake/files/BlueWake/pgo)
          fi
          cmake -S cmake/composite -B "$OUT/composite-pgo" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=$ABI -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGAME_ID=GZLE01 \
            -DCOMPOSITE_DIR="$PWD/$OUT/composite-src" \
            -DGXRUNTIME_DIR="$PWD/ref/recompcore/GXRuntime" \
            -DABI_DIR="$PWD/ref/recompcore/Source/Core/Core/PowerPC/StaticRecomp" \
            -DCOMPOSITE_OPTIMIZATION_LEVEL=2 \
            "${extra[@]}" 2>&1 | tee configure.log

      - name: Build the module
        run: |
          set -euo pipefail
          cmake --build "$OUT/composite-pgo" --target "$MODULE" -j "$(nproc)" \
            2>&1 | tee build.log
          ls -la "$OUT/composite-pgo/$MODULE.so"

      - name: Strip and package the module
        env:
          PROFILE_URL: ${{ github.event.inputs.profile_url }}
        run: |
          set -euo pipefail
          if [ -n "$PROFILE_URL" ]; then kind=pgo; else kind=instrumented; fi
          strip_bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          install -m 644 "$OUT/composite-pgo/$MODULE.so" "$OUT/$MODULE-stripped.so"
          # --strip-debug drops the ~740 MB of debug info and keeps the symbol
          # table, which the audit and any later profile step need for function
          # names. This is the file the APK ships.
          "$strip_bin" --strip-debug "$OUT/$MODULE-stripped.so"
          mkdir -p "$OUT/pkg"
          cp "$OUT/$MODULE-stripped.so" "$OUT/pkg/lib$MODULE.so"
          tar -czf "$OUT/$MODULE-$kind.tar.gz" -C "$OUT/pkg" "lib$MODULE.so"
          ls -la "$OUT/$MODULE-stripped.so" "$OUT/$MODULE-$kind.tar.gz"

      - name: Summary
        if: always()
        env:
          PROFILE_URL: ${{ github.event.inputs.profile_url }}
        run: |
          {
            echo "### Android PGO module"
            echo ""
            echo "- variant: $([ -n "$PROFILE_URL" ] && echo profile-optimized || echo instrumented)"
            echo "- composite: $([ -f "$OUT/composite-src/generated.h" ] && echo 'cached or generated' || echo missing)"
            echo "- unstripped: $(stat -c %s "$OUT/composite-pgo/$MODULE.so" 2>/dev/null || echo n/a) bytes"
            echo "- stripped:   $(stat -c %s "$OUT/$MODULE-stripped.so" 2>/dev/null || echo n/a) bytes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the module
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MODULE }}-${{ inputs.profile_url != '' && 'pgo' || 'instrumented' }}
          path: ${{ env.OUT }}/${{ env.MODULE }}-*.tar.gz
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgo-logs-${{ github.run_id }}
          path: |
            configure.log
            build.log
          if-no-files-found: ignore
          retention-days: 7